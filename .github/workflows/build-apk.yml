name: Build APK

on:
  push:
    branches:
      - main
      - 'claude/**'
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
        working-directory: Ultragol1

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace
        working-directory: Ultragol1

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ultragol-debug-apk
          path: Ultragol1/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
